<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>wiggle — capstan probe (emergent winding)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #0b0d10;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #cbd0d6;
    }
    #hud {
      position: fixed; top: 12px; left: 14px; pointer-events: none;
      font-size: 12px; letter-spacing: 0.04em; opacity: 0.7;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    #hud .title { font-size: 14px; font-weight: 600; opacity: 1; }
    #hud .sub { font-size: 11px; opacity: 0.55; margin-top: 2px; }
    #status {
      position: fixed; bottom: 14px; left: 14px; pointer-events: none;
      font-size: 11px; letter-spacing: 0.05em; opacity: 0.85;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6); line-height: 1.5;
    }
    #status .phase { color: #d8a878; }
    #status .count { color: #88c5a4; }
    canvas { display: block; }
    a.nav { position: fixed; top: 12px; right: 18px; color: #88a8c5; opacity: 0.55; font-size: 11px; text-decoration: none; letter-spacing: 0.05em; }
    a.nav:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="title">wiggle &middot; capstan probe</div>
    <div class="sub">emergent winding &middot; 重力ゼロ &middot; 摩擦+張力のみ &middot; drag to orbit</div>
  </div>
  <div id="status"></div>
  <a class="nav" href="./winding.html">→ winding studio</a>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/+esm"
    }
  }
  </script>
  <script type="module">
    const v = Date.now();
    import(`./capstan.js?v=${v}`).catch(e => {
      console.error("module load failed:", e);
      const div = document.createElement("div");
      div.style.cssText = "color:#f88;padding:24px;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1c20;border:1px solid #f88;border-radius:8px;font-family:ui-monospace,monospace;max-width:80vw;font-size:12px;line-height:1.5;white-space:pre-wrap";
      div.textContent = "module load error:\n" + (e.stack || e.message);
      document.body.appendChild(div);
    });
  </script>
</body>
</html>
